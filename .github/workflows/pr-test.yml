name: PR test

# Runs on pull requests only. Pushes to main come from the GitLab mirror —
# those commits have already passed GitLab CI, so re-running here would be
# duplicate work. Image builds are still owned by GitLab CI; this workflow
# only gives contributors quick build + test feedback on their PRs.

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
